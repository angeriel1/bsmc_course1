# minikube tunnel
# kubectl delete ns hello-app

apiVersion: v1
kind: Namespace
metadata:
  name: hello-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-app
          image: ghcr.io/mbrandeburg/bsmc_course1:1.0.0
          env:
            - name: PORT
              value: "5001"
          ports:
            - name: http
              containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: hello-app
  namespace: hello-app
spec:
  type: LoadBalancer
  selector:
    app: hello-app
  ports:
    - port: 8001
      targetPort: http